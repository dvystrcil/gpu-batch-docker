# Image build for the GPU batch lane (homelab#1935).
#
# Same three layers as the rest of the fleet: push :dev + :sha-<sha> from
# main, release-action cuts a patch-bump release, docker-release.yaml
# promotes :dev to X.Y.Z (no `v` on image tags), and the ImageUpdater CR in
# dvystrcil/gpu-batch tracks the semver.
#
# Prerequisite: the `gpu-batch-docker-runner` ARC scale set in
# dvystrcil/argocd-projects:arc/arc-build-runners.yaml.

name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.github/CODEOWNERS'
  pull_request:
  workflow_dispatch:

env:
  INTERNAL_REGISTRY: harbor-core.harbor.svc.cluster.local
  PROJECT: ai

jobs:
  # Build every image and RUN them chained, before anything is pushed: a
  # green docker build says nothing about whether the tool starts, the runner
  # imports, the guard refuses, or the webhook fires. One compose run per
  # case (tests/compose/, gpu-batch-docker#10): freecad -> prusaslicer and
  # blender in parallel, against a mock Moonraker and a webhook sink. CI has
  # no GPU, so blender renders on CPU. This replaces the per-image smoke
  # scripts; see the README's "Testing the images".
  compose-test:
    runs-on: gpu-batch-docker-runner
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Compose v2 is a plugin in the homelab-built runner image
      # (arc-runner-docker); fail here, not halfway through, if it's gone.
      - name: Docker Compose is available
        run: docker compose version

      - name: Build the images
        run: |
          for t in runner freecad prusaslicer blender; do
            docker build --target "$t" -t "gpu-batch-$t:ci" .
          done

      - name: Run every harness case against the built images
        env:
          RUNNER_IMAGE: gpu-batch-runner:ci
          FREECAD_IMAGE: gpu-batch-freecad:ci
          PRUSASLICER_IMAGE: gpu-batch-prusaslicer:ci
          BLENDER_IMAGE: gpu-batch-blender:ci
        run: bin/compose-test.sh | tee compose-test.out

      # The driver prints COMPOSE-TEST-OK only as its last line, and only if
      # every case's assert did; a crash that still exits 0 would not reach it.
      - name: Assert the harness completed
        run: test "$(tail -n 1 compose-test.out)" = COMPOSE-TEST-OK

  build:
    needs: compose-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: gpu-batch-docker-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: blender
            image: gpu-batch-blender
          - target: freecad
            image: gpu-batch-freecad
          - target: prusaslicer
            image: gpu-batch-prusaslicer
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One named secret per step, never the whole store (see
      # homelab/.github/workflows/build-homelab-bin.yaml for why).
      - name: Fetch the Harbor username
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: HB_USERNAME
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Fetch the Harbor password
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: HB_PASSWORD
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Assert every scoped secret arrived
        run: |
          for v in HB_USERNAME HB_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::$v not fetched — renamed in Infisical?"; exit 1; }
          done

      - name: Log in to Harbor (internal)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.INTERNAL_REGISTRY }}
          username: ${{ env.HB_USERNAME }}
          password: ${{ env.HB_PASSWORD }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config-inline: |
            [registry."harbor-core.harbor.svc.cluster.local"]
              ca=["/etc/ssl/certs/ca-certificates.crt"]

      - name: Build + push (dev image)
        env:
          BUILDKIT_PROGRESS: plain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          # amd64 only: every upstream build (Blender tarball, FreeCAD AppImage, PrusaSlicer's Flathub x86_64 ref) is x86-64.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ matrix.image }}:dev
            ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ matrix.image }}:buildcache,mode=max

      # The pushed artifact, not the compose-test build, is what ships. Pull it back
      # and assert it carries the pinned tool and the runner.
      - name: Assert the pushed image runs
        run: |
          IMG="${INTERNAL_REGISTRY}/${PROJECT}/${{ matrix.image }}:sha-${GITHUB_SHA}"
          case "${{ matrix.target }}" in
            blender) docker run --rm --entrypoint blender "$IMG" --version | tee v.out
                     grep -q '^Blender 5\.2\.' v.out ;;
            freecad) docker run --rm --entrypoint freecadcmd "$IMG" --version | tee v.out
                     grep -q '^FreeCAD 26\.3\.' v.out ;;
            prusaslicer) docker run --rm --entrypoint prusa-slicer "$IMG" --help > v.out
                     head -n 1 v.out
                     grep -q '^PrusaSlicer-2\.9\.7+' v.out ;;
          esac
          docker run --rm "$IMG" --help | grep -q 'gpu-batch-run'

  # One release per push, after EVERY image in the matrix is pushed and
  # verified: a release fires docker-release.yaml, which promotes :dev of
  # each image, so it must not run per matrix leg or before both exist.
  release:
    needs: build
    runs-on: gpu-batch-docker-runner
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch the CICD App client id
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: CICD_APP_CLIENT_ID
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Fetch the CICD App private key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: CICD_APP_PRIVATE_KEY
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Assert every scoped secret arrived
        run: |
          for v in CICD_APP_CLIENT_ID CICD_APP_PRIVATE_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v not fetched — renamed in Infisical?"; exit 1; }
          done

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ env.CICD_APP_CLIENT_ID }}
          private-key: ${{ env.CICD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: gpu-batch-docker

      - name: Create GitHub release
        # Patch++ off the latest release; publishing fires docker-release.yaml.
        uses: dvystrcil/release-action@v0.2.1
        with:
          token: ${{ steps.app-token.outputs.token }}
