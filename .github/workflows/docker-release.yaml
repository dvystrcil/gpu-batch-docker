# Promote `:dev` to semver release tags when a GitHub release is published.
# No rebuild: re-tag the :dev that build.yaml pushed after the compose harness passed, to
# {{version}} and {{major}}.{{minor}} (no `v` prefix on image tags). Every
# image build.yaml pushes is promoted to the same version.

name: docker-release

on:
  release:
    types: [published]

env:
  INTERNAL_REGISTRY: harbor-core.harbor.svc.cluster.local
  PROJECT: ai

jobs:
  promote:
    runs-on: gpu-batch-docker-runner
    strategy:
      fail-fast: false
      matrix:
        image: [gpu-batch-blender, gpu-batch-freecad, gpu-batch-prusaslicer]

    steps:
      # One named secret per step, never the whole store.
      - name: Fetch the Harbor username
        uses: Infisical/secrets-action@v1.0.18
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: HB_USERNAME
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Fetch the Harbor password
        uses: Infisical/secrets-action@v1.0.18
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: HB_PASSWORD
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.INTERNAL_REGISTRY }}
          username: ${{ env.HB_USERNAME }}
          password: ${{ env.HB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor-core.harbor.svc.cluster.local"]
              ca=["/etc/ssl/certs/ca-certificates.crt"]

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Promote dev to release tags
        run: |
          for TAG in $(jq -cr '[.tags[]] | unique | .[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools create -t "$TAG" \
              ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ matrix.image }}:dev
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}

  # The deploy repo's only workload is a suspended CronJob (the Job
  # template). argocd-image-updater cannot see CronJobs (homelab#951), so
  # the bump is a PR opened here, after promote, when the tag is known to
  # exist in Harbor for EVERY image. One PR bumps each image the deploy repo
  # lists; an image it does not list yet (no template) is skipped, not added.
  bump-deploy-repo:
    needs: promote
    runs-on: gpu-batch-docker-runner
    steps:
      - name: Fetch the CICD App client id
        uses: Infisical/secrets-action@v1.0.18
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: CICD_APP_CLIENT_ID
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Fetch the CICD App private key
        uses: Infisical/secrets-action@v1.0.18
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: CICD_APP_PRIVATE_KEY
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ env.CICD_APP_CLIENT_ID }}
          private-key: ${{ env.CICD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: gpu-batch

      - uses: actions/checkout@v7
        with:
          repository: dvystrcil/gpu-batch
          token: ${{ steps.app-token.outputs.token }}

      # AFTER the deploy-repo checkout, which cleans the workspace root.
      - name: Checkout this repo's bump helpers
        uses: actions/checkout@v7
        with:
          path: .gpu-batch-docker
          sparse-checkout: .github/scripts

      - name: Open the tag bump PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"   # git tags are v-prefixed, image tags are not
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected tag $TAG"; exit 1; }
          F=overlays/kustomization.yaml
          # Targeted edit of the newTag line under each image's name line,
          # never a YAML round-trip.
          bumped=()
          for IMG in gpu-batch-blender gpu-batch-freecad gpu-batch-prusaslicer; do
            NAME="- name: harbor.sirddail.net/ai/${IMG}"
            if ! grep -qxF -e "$NAME" "$F"; then echo "::notice::${IMG} not in $F yet, skipped"; continue; fi
            N=$(grep -nxF -e "$NAME" "$F" | cut -d: -f1)
            sed -n "$((N+1))p" "$F" | grep -q '^  newTag: ' || { echo "::error::no newTag line under ${IMG} in $F"; exit 1; }
            sed -i "$((N+1))s/^  newTag: .*/  newTag: ${VERSION}/" "$F"
            bumped+=("$IMG")
          done
          [ "${#bumped[@]}" -gt 0 ] || { echo "::error::no image of ours in $F"; exit 1; }
          if git diff --quiet; then echo "already at ${VERSION}"; exit 0; fi
          [ "$(git diff --numstat | awk '{print $1+$2}')" -le $((2 * ${#bumped[@]})) ] || { git diff; echo "::error::bump touched more than one line per image"; exit 1; }
          # homelab's merge-receipt sweep reads the namespace and the templates
          # from this marker: the diff alone says `overlays`, and a suspended
          # CronJob never runs a Job to verify (homelab#1992).
          WORKLOADS=$(bash "$GITHUB_WORKSPACE/.gpu-batch-docker/.github/scripts/receipt-workloads.sh" . "${bumped[@]}")
          BR="bump/gpu-batch-${VERSION}"
          # homelab's auto-merge gate (bin/pr-auto-merge.py, image-bump) needs
          # every commit authored by homelab-bump-bot, as bump-image-tag.py
          # writes them. noreply@github.com is attributed to `web-flow`, and
          # the gate held every bump for a human (gpu-batch#14).
          git config user.name "homelab-bump-bot"
          git config user.email "noreply@sirddail.net"
          git checkout -b "$BR"
          git commit -qam "build: ${bumped[*]} ${VERSION}"
          git push -q origin "$BR"
          gh pr create --repo dvystrcil/gpu-batch --head "$BR" \
            --title "build: ${bumped[*]} ${VERSION}" \
            --body "Released by ${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG} and promoted (${bumped[*]} at \`${VERSION}\` in harbor.sirddail.net/ai) before this PR was opened.

          receipt-target: image-bump ns=gpu-batch workloads=${WORKLOADS}"
